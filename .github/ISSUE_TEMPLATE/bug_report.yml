name: Bug report
description: Report something that does not work as expected in CFVigil
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        This form is for bugs in CFVigil. Explain what you did, what you expected,
        and what happened instead. A repeatable example helps, but you do not
        need to debug the code yourself. Ideas for new features belong in the
        separate Suggest an improvement form.

        Remove Cloudflare API tokens, account and zone IDs, private Worker names,
        private domains, request headers, personal paths, usernames and sensitive
        details from any logs or screenshots. Report security vulnerabilities
        privately using the Security link. The maintainer welcomes reports but
        does not accept outside code contributions or pull requests.

  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - System tray and compact card
        - Resource discovery
        - Worker build or deployment status
        - Pages deployment status
        - Worker error-spike analytics
        - WAF or security incident
        - Alerts and event history
        - Settings or Cloudflare API token
        - Installation or update
        - Other reproducible defect
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: CFVigil version or Git commit SHA
      placeholder: "0.1.0 or a commit SHA from dev"
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: OS, desktop environment and session
      placeholder: "Ubuntu 26.04, KDE Plasma 6, Wayland / Windows 11"
    validations:
      required: true

  - type: dropdown
    id: installation
    attributes:
      label: Installation method
      options:
        - From source (cargo run)
        - DEB
        - AppImage
        - Windows installer
        - Other / not sure
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open CFVigil.
        2. ...
        3. Observe the problem.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true

  - type: dropdown
    id: frequency
    attributes:
      label: How often does this happen?
      options:
        - Every time
        - Often
        - Sometimes
        - Happened once
        - Not tested again
    validations:
      required: false

  - type: textarea
    id: diagnostics
    attributes:
      label: Sanitized logs, screenshots and approximate event time (optional)
      description: Use non-sensitive examples and include the time zone if reporting incorrect event timestamps.

  - type: checkboxes
    id: confirmation
    attributes:
      label: Before submitting
      options:
        - label: I checked for an existing report of this bug.
          required: true
        - label: I removed all credentials, API tokens and sensitive Cloudflare details.
          required: true
