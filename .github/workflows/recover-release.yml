name: Recover approved CFVigil publication

# An owner-approved temporary branch is the only recovery entry point.
# Ordinary dev pushes and version tags cannot start this workflow.
on:
  push:
    branches: [release-recovery]
    paths: ['ci/run-release-recovery.json']

permissions:
  contents: read
  actions: read
concurrency:
  group: cfvigil-release
  cancel-in-progress: false

jobs:
  validate:
    if: github.repository == 'morozhenko-apps/cfvigil' && github.ref == 'refs/heads/release-recovery' && github.event.deleted == false
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      version: ${{ steps.admit.outputs.version }}
      tag: ${{ steps.admit.outputs.tag }}
      commit: ${{ steps.admit.outputs.commit }}
      source_run_id: ${{ steps.admit.outputs.source_run_id }}
      linux_artifact_id: ${{ steps.admit.outputs.linux_artifact_id }}
      windows_artifact_id: ${{ steps.admit.outputs.windows_artifact_id }}
    steps:
      - uses: actions/checkout@v5
        with: {persist-credentials: false}
      - uses: actions/setup-node@v7
        with: {node-version: 24}
      - name: Admit original successful builds and unchanged approved source tag
        id: admit
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release_recovery.py --request ci/run-release-recovery.json
      - name: Install real signed-APT verification prerequisites
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends dpkg-dev gnupg gpgv
      - name: Verify corrected recovery code without rebuilding installers
        env:
          RELEASE_TAG: ${{ steps.admit.outputs.tag }}
        run: |
          set -euo pipefail
          node scripts/candidate-version.mjs --check-tag "$RELEASE_TAG"
          node --test tests/*.test.mjs
          python3 -m unittest discover -s tests -p 'test_release_*.py'

  publish:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    environment: cfvigil-release
    permissions:
      contents: read
      actions: read
    outputs:
      receipt: ${{ steps.publish.outputs.receipt }}
    env:
      VERSION: ${{ needs.validate.outputs.version }}
      RELEASE_TAG: ${{ needs.validate.outputs.tag }}
      SOURCE_COMMIT: ${{ needs.validate.outputs.commit }}
      SOURCE_RUN_ID: ${{ needs.validate.outputs.source_run_id }}
      APPROVED_TAG: ${{ vars.CFVIGIL_RELEASE_APPROVED_TAG }}
      CFVIGIL_APT_FINGERPRINT: ${{ vars.CFVIGIL_APT_FINGERPRINT }}
      CFVIGIL_R2_ACCOUNT_ID: ${{ vars.CFVIGIL_R2_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
        with: {persist-credentials: false}
      - uses: actions/setup-node@v7
        with: {node-version: 24}
      - name: Re-admit source after protected owner approval
        id: admit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 scripts/release_recovery.py --request ci/run-release-recovery.json \
            --approved-tag "$APPROVED_TAG"
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ steps.admit.outputs.linux_artifact_id }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.admit.outputs.source_run_id }}
          merge-multiple: true
          path: ${{ runner.temp }}/release/linux
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ steps.admit.outputs.windows_artifact_id }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.admit.outputs.source_run_id }}
          merge-multiple: true
          path: ${{ runner.temp }}/release/windows
      - name: Require dedicated environment and approved source tag
        run: |
          set -euo pipefail
          [[ -n "$APPROVED_TAG" && "$APPROVED_TAG" = "$RELEASE_TAG" ]]
          [[ "$CFVIGIL_APT_FINGERPRINT" =~ ^[a-fA-F0-9]{40}$ ]]
          [[ "$CFVIGIL_R2_ACCOUNT_ID" =~ ^[a-f0-9]{32}$ ]]
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends dpkg-dev gnupg gpgv
          python3 -m venv "$RUNNER_TEMP/release-python"
          "$RUNNER_TEMP/release-python/bin/pip" install --no-cache-dir \
            -r scripts/requirements-release.txt
          umask 077
          mkdir -p "$RUNNER_TEMP/private/gnupg"
          chmod 700 "$RUNNER_TEMP/private/gnupg"
      - name: Verify dedicated signing subkey without importing the primary
        env:
          SUBKEY_B64: ${{ secrets.CFVIGIL_APT_SIGNING_SUBKEY_BASE64 }}
          SUBKEY_PASSPHRASE: ${{ secrets.CFVIGIL_APT_SIGNING_PASSPHRASE }}
        run: |
          set -euo pipefail
          [[ -n "$SUBKEY_B64" && -n "$SUBKEY_PASSPHRASE" ]]
          umask 077
          printf '%s' "$SUBKEY_B64" | base64 --decode > "$RUNNER_TEMP/private/subkey.gpg"
          printf '%s' "$SUBKEY_PASSPHRASE" > "$RUNNER_TEMP/private/passphrase"
          gpg --homedir "$RUNNER_TEMP/private/gnupg" --batch \
            --import "$RUNNER_TEMP/private/subkey.gpg" >/dev/null 2>&1
          rm -f "$RUNNER_TEMP/private/subkey.gpg"
          gpg --homedir "$RUNNER_TEMP/private/gnupg" --batch --with-colons \
            --list-secret-keys "$CFVIGIL_APT_FINGERPRINT" > "$RUNNER_TEMP/private/inventory"
          python3 scripts/verify_signing_key.py \
            --listing "$RUNNER_TEMP/private/inventory" --fingerprint "$CFVIGIL_APT_FINGERPRINT"
          rm -f "$RUNNER_TEMP/private/inventory"
      - name: Produce signed flat APT metadata for the original DEB
        run: |
          set -euo pipefail
          python3 scripts/apt_repository.py \
            --deb "$RUNNER_TEMP/release/linux/cfvigil_$VERSION"_amd64.deb \
            --out "$RUNNER_TEMP/apt" --version "$VERSION" \
            --gpg-home "$RUNNER_TEMP/private/gnupg" \
            --fingerprint "$CFVIGIL_APT_FINGERPRINT" \
            --passphrase-file "$RUNNER_TEMP/private/passphrase"
      - name: Publish original installers and verify complete public bytes
        id: publish
        env:
          CFVIGIL_R2_ACCESS_KEY_ID: ${{ secrets.CFVIGIL_R2_ACCESS_KEY_ID }}
          CFVIGIL_R2_SECRET_ACCESS_KEY: ${{ secrets.CFVIGIL_R2_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/release-python/bin/python" scripts/r2_release.py \
            --release "$RUNNER_TEMP/release" --apt "$RUNNER_TEMP/apt" \
            --version "$VERSION" --commit "$SOURCE_COMMIT" --run-id "$SOURCE_RUN_ID" \
            --receipt "$RUNNER_TEMP/publication-receipt.json"
          printf 'receipt=' >> "$GITHUB_OUTPUT"
          base64 -w0 "$RUNNER_TEMP/publication-receipt.json" >> "$GITHUB_OUTPUT"
          printf '\n' >> "$GITHUB_OUTPUT"
      - name: Destroy temporary GPG secret materials
        if: always()
        run: |
          if [[ -d "$RUNNER_TEMP/private/gnupg" ]]; then
            gpgconf --homedir "$RUNNER_TEMP/private/gnupg" --kill gpg-agent || true
          fi
          rm -rf "$RUNNER_TEMP/private"

  cleanup:
    needs: [validate, publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v5
        with: {persist-credentials: false}
      - uses: actions/setup-node@v7
        with: {node-version: 24}
      - name: Remove original archives only after verified publication receipt
        env:
          RECEIPT_BASE64: ${{ needs.publish.outputs.receipt }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ -n "$RECEIPT_BASE64" ]]
          printf '%s' "$RECEIPT_BASE64" | base64 --decode > "$RUNNER_TEMP/receipt.json"
          node scripts/cleanup-published-artifacts.mjs --verified-receipt "$RUNNER_TEMP/receipt.json"
          rm -f "$RUNNER_TEMP/receipt.json"

  github-release:
    needs: [validate, publish, cleanup]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Finalize the original approved tag with text-only download links
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.validate.outputs.version }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --verify-tag --title "CFVigil $RELEASE_TAG" \
            --notes "CFVigil $VERSION. Linux DEB: https://download.morozhenko.com/dist/CFVigil/linux/cfvigil_${VERSION}_amd64.deb . Linux AppImage: https://download.morozhenko.com/dist/CFVigil/linux/CFVigil-${VERSION}-linux-x64.AppImage . Windows installer: https://download.morozhenko.com/dist/CFVigil/windows/CFVigil-Setup-${VERSION}-win-x64.exe . Flat signed APT: https://download.morozhenko.com/dist/CFVigil/linux/ (distribution ./). Latest verified release manifest: https://download.morozhenko.com/dist/CFVigil/latest.json . Windows NSIS is unsigned. Verify SHA256 before installation. No GitHub binary attachments."
