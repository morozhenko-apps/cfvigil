name: Source Checks
on:
  push:
    branches: [dev, main]
    paths-ignore:
      - '**/*.md'
      - LICENSE
      - NOTICE
  pull_request:
    branches: [dev, main]
    paths-ignore:
      - '**/*.md'
      - LICENSE
      - NOTICE
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: cfvigil-source-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stable:
    name: Stable source and desktop checks
    runs-on: [self-hosted, Linux, X64]
    container:
      image: ubuntu:24.04
    timeout-minutes: 80
    steps:
      - name: Install Tauri and build dependencies inside job container
        shell: bash
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates curl git file pkg-config build-essential \
            libssl-dev libwebkit2gtk-4.1-dev libgtk-3-dev \
            libgtk-layer-shell-dev libayatana-appindicator3-dev \
            libxdo-dev librsvg2-dev libwayland-dev libwayland-bin wayland-protocols
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Record tool versions
        run: |
          node --version
          rustc --version
          cargo --version
      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          for file in apps/desktop/ui/*.mjs; do
            node --check "$file"
          done
      - name: Run deterministic JavaScript tests
        run: node --test tests/*.test.mjs
      - name: Check Rust desktop source
        run: cargo check -p cfvigil-desktop
      - name: Run Rust domain and provider tests
        run: cargo test -p cfvigil-desktop
      - name: Publish native GitHub stable-check status
        if: always()
        shell: bash
        env:
          GITHUB_API_TOKEN: ${{ github.token }}
          JOB_CONCLUSION: ${{ job.status }}
        run: |
          set -euo pipefail
          state=failure
          if [[ "$JOB_CONCLUSION" == success ]]; then state=success; fi
          url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          payload="$(printf '{"state":"%s","context":"cfvigil/stable","description":"Source and native Rust checks: %s","target_url":"%s"}' "$state" "$JOB_CONCLUSION" "$url")"
          curl --fail-with-body --silent --show-error --request POST \
            --header "Authorization: Bearer ${GITHUB_API_TOKEN}" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            --data "$payload" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}"
