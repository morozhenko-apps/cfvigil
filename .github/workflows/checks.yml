name: Preflight

on:
  push:
    branches: [dev, main]
    paths-ignore:
      - 'docs/**'
      - 'doc/**'
      - '**/docs/**'
      - '**/doc/**'
      - 'README.md'
      - '**/README.md'
      - 'AGENTS.md'
      - '**/AGENTS.md'
      - 'CONTRIBUTING.md'
      - 'NOTICE'
      - 'LICENSE'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE.md'
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ui:
    name: JavaScript syntax and stable tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Check all UI module syntax
        shell: bash
        run: |
          set -euo pipefail
          for file in apps/desktop/ui/*.mjs; do
            node --check "$file"
          done
      - name: Run stable UI unit tests
        run: node --test tests/*.test.mjs

  desktop:
    name: Rust desktop check and tests (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Tauri 2 Linux build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential curl file pkg-config libssl-dev \
            libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev libgtk-layer-shell-dev \
            libxdo-dev librsvg2-dev libwayland-dev \
            libwayland-bin wayland-protocols
      - name: Check Rust desktop
        run: cargo check -p cfvigil-desktop
      - name: Run Rust desktop and policy tests
        run: cargo test -p cfvigil-desktop

  preflight:
    name: Preflight result
    if: always()
    needs: [ui, desktop]
    runs-on: ubuntu-24.04
    steps:
      - name: Require both jobs green
        env:
          RESULTS: ${{ join(needs.*.result, ',') }}
        run: |
          echo "$RESULTS"
          test "$RESULTS" = "success,success"
