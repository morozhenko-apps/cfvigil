name: Preflight

# Ordinary pushes are deliberate: request one final gate with the marker.
on:
  push:
    branches: [dev]
    paths: ['ci/run-preflight.txt']
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    name: Resolve verification scope
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      required: ${{ steps.classify.outputs.required }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Classify complete PR merge diff
        id: classify
        run: bash scripts/ci-pr-scope.sh

  javascript:
    name: Stable JavaScript and generated assets
    needs: scope
    if: needs.scope.outputs.required == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-node@v7
        with: {node-version: 26.13.0}
      - name: Syntax and generated asset contracts
        run: |
          set -euo pipefail
          for file in apps/desktop/ui/*.mjs scripts/*.mjs; do node --check "$file"; done
          node scripts/check-i18n.mjs
          node scripts/check-icon-assets.mjs
      - name: Stable JavaScript once
        run: node --test tests/*.test.mjs

  distribution:
    name: Stable Python distribution and CI contracts
    needs: scope
    if: needs.scope.outputs.required == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7.0.1
        with: {persist-credentials: false}
      - name: Install isolated contract prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3-pil python3-venv dpkg-dev gnupg gpgv
      - name: Stable release and synthetic icon contracts once
        run: |
          python3 -m unittest discover -s tests -p 'test_release_*.py'
          python3 -m unittest discover -s tests -p 'test_icon_import.py'
      - name: CI policy and scope contracts
        run: |
          python3 -m venv "$RUNNER_TEMP/ci-policy"
          "$RUNNER_TEMP/ci-policy/bin/python" -m pip install -r scripts/requirements-ci.txt
          "$RUNNER_TEMP/ci-policy/bin/python" -m unittest discover -s tests -p 'test_ci_policy.py' -v

  rust:
    name: Stable Rust desktop verification
    needs: scope
    if: needs.scope.outputs.required == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7.0.1
        with: {persist-credentials: false}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # Swatinem/rust-cache@v2.9.3
        with:
          workspaces: . -> target
          shared-key: cfvigil-stable-rust
          save-if: ${{ github.ref == 'refs/heads/dev' && github.event_name != 'pull_request' }}
      - name: Install native desktop prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential curl file pkg-config libssl-dev \
            libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev libgtk-layer-shell-dev \
            libxdo-dev librsvg2-dev libwayland-dev libwayland-bin wayland-protocols
      - name: Check and test Rust once
        run: |
          cargo check --locked -p cfvigil
          cargo test --locked -p cfvigil

  stable:
    name: Stable UI and Rust verification
    if: always()
    needs: [scope, javascript, distribution, rust]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      SCOPE_RESULT: ${{ needs.scope.result }}
      REQUIRED: ${{ needs.scope.outputs.required }}
      JS_RESULT: ${{ needs.javascript.result }}
      PYTHON_RESULT: ${{ needs.distribution.result }}
      RUST_RESULT: ${{ needs.rust.result }}
    steps:
      - name: Require exact applicable outcomes
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SCOPE_RESULT" == success ]] || exit 1
          case "$REQUIRED" in
            true) expected=success ;;
            false) expected=skipped ;;
            *) exit 1 ;;
          esac
          for result in "$JS_RESULT" "$PYTHON_RESULT" "$RUST_RESULT"; do
            [[ "$result" == "$expected" ]] || exit 1
          done
