name: Preflight

# dev is the primary working branch. Pushes to code, docs and agent rules
# do NOT start CI. An owner/agent requests one complete verification run
# only after finishing a feature by changing ci/run-preflight.txt.
# PR verification remains automatic for the exceptional temporary branch.
on:
  push:
    branches: [dev]
    paths:
      - 'ci/run-preflight.txt'
  pull_request:
    branches: [dev, main]
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'apps/desktop/**'
      - 'tests/**'
      - '.github/workflows/checks.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  stable:
    name: Stable UI and Rust verification
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          for file in apps/desktop/ui/*.mjs; do
            node --check "$file"
          done
      - name: Run stable JavaScript tests
        run: node --test tests/*.test.mjs
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Tauri 2 Linux dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential curl file pkg-config libssl-dev \
            libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev libgtk-layer-shell-dev \
            libxdo-dev librsvg2-dev libwayland-dev \
            libwayland-bin wayland-protocols
      - name: Check Rust desktop
        run: cargo check -p cfvigil-desktop
      - name: Run Rust desktop unit and provider tests
        run: cargo test -p cfvigil-desktop
