name: Source Checks
on:
  push:
    branches: [dev, main]
    paths-ignore:
      - "**/*.md"
      - "LICENSE"
      - "NOTICE"
  pull_request:
    branches: [dev, main]
    paths-ignore:
      - "**/*.md"
      - "LICENSE"
      - "NOTICE"
jobs:
  node-tests:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Run deterministic status tests
        run: node --test tests/*.test.mjs
