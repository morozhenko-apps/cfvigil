name: Source Checks
on:
  push:
    branches: [dev, main]
    paths-ignore:
      - "**/*.md"
      - "LICENSE"
      - "NOTICE"
  pull_request:
    branches: [dev, main]
    paths-ignore:
      - "**/*.md"
      - "LICENSE"
      - "NOTICE"
jobs:
  stable:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Verify Node.js status rules
        run: node --test tests/*.test.mjs
      - name: Check Rust desktop source
        run: cargo check -p cfvigil-desktop
      - name: Run Rust domain tests
        run: cargo test -p cfvigil-desktop
