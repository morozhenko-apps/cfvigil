[package]
name = "cfvigil"
version = "1.0.0"
edition = "2021"
license = "Apache-2.0"
authors = ["Stanislav Moseyko (morozhenko)"]
description = "Local Cloudflare deploy monitoring tray companion"
build = "build.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
keyring = { version = "=4.2.0", default-features = false, features = ["v1"] }
tokio = { version = "1", features = ["macros", "time", "sync"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
open = "5"
# Native-only launch-at-login registration (Linux XDG, Windows registry).
# JS does not receive direct autostart plugin permissions.
tauri-plugin-autostart = "2"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
gtk-layer-shell = { version = "=0.8.2", features = ["v0_6"] }
ksni = { version = "=0.3.6", default-features = false, features = ["async-io", "blocking"] }
image = { version = "0.25", default-features = false, features = ["png"] }
