<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <link rel="icon" type="image/png" href="./icon.png">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>CFVigil</title>
  <link rel="stylesheet" href="./style.css">
  <script type="module" src="./app.mjs"></script>
</head>
<body>
  <main id="card" class="card" data-view="compact">
    <section id="drawer" class="drawer" hidden data-i18n-aria-label="card.drawerLabel">
      <div id="provider-warning" class="provider-warning" role="status" hidden></div>
      <div id="resource-list" class="rows" role="list" data-i18n-aria-label="card.listLabel"></div>
    </section>
    <div id="search-row" class="search-row" hidden>
      <input id="search" autocomplete="off" data-i18n-placeholder="card.searchPlaceholder" data-i18n-aria-label="card.searchLabel">
    </div>
    <div id="announcement" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></div>
    <div class="actions" data-i18n-aria-label="card.actionsLabel">
      <div class="metric metric-healthy"><strong id="healthy">—</strong><span data-i18n="card.healthy"></span></div>
      <div class="metric metric-deploying"><strong id="deploying">—</strong><span data-i18n="card.deploying"></span></div>
      <div class="metric metric-issues"><strong id="issues">—</strong><span data-i18n="card.issues"></span></div>
      <button id="toggle-list" class="action" type="button" aria-pressed="false" aria-expanded="false" aria-controls="drawer" data-i18n-title="card.toggleTitle"><span class="glyph glyph-sync" aria-hidden="true"><span class="glyph-resources">▤</span><svg class="glyph-spinner" viewBox="0 0 24 24" focusable="false"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg></span><span data-i18n="card.resources"></span></button>
      <button id="hide" class="action" type="button" data-i18n-title="card.hideTitle"><span class="glyph glyph-chevron" aria-hidden="true"><svg viewBox="0 0 24 24" focusable="false"><path d="m5 9 7 7 7-7"/></svg></span><span data-i18n="card.hide"></span></button>
    </div>
  </main>
</body>
</html>
