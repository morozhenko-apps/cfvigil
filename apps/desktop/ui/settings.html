<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <title data-i18n="settings.title"></title>
  <link rel="stylesheet" href="./window.css">
  <script type="module" src="./settings.mjs"></script>
</head>
<body>
  <h2 data-i18n="settings.connection"></h2>
  <form id="form">
    <label><span data-i18n="settings.account"></span><input id="account" data-i18n-placeholder="settings.accountPlaceholder" autocomplete="off" required></label>
    <label><span data-i18n="settings.token"></span><input id="token" type="password" autocomplete="new-password" data-i18n-placeholder="settings.tokenPlaceholder"></label>
    <label><span data-i18n="settings.interval"></span><select id="interval">
      <option value="60" data-i18n="settings.oneMinute"></option>
      <option value="180" data-i18n="settings.threeMinutes"></option>
      <option value="300" data-i18n="settings.fiveMinutes"></option>
      <option value="600" data-i18n="settings.tenMinutes"></option>
    </select></label>
    <label><span data-i18n="settings.language"></span><select id="language" disabled></select></label>
    <label class="toggle"><input id="autostart" type="checkbox" disabled><span data-i18n="settings.autostart"></span></label>
    <p id="autostart-hint" class="hint" data-i18n="settings.checkingAutostart"></p>
    <p class="hint" data-i18n="settings.tokenHelp"></p>
    <div id="message" role="status"></div>
    <div class="footer"><button type="button" id="cancel" data-i18n="settings.cancel"></button><button type="submit" data-i18n="settings.apply"></button></div>
  </form>
</body>
</html>
